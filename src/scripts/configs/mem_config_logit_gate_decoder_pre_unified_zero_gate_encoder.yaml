# ============================================================
# Gate-only membrane fine-tuning with zeroed gate encoder output.
# In ABACUST.forward(...) and ABACUST.nar_sample(...), the tensor
# mem_logit_gate_h_V / mem_logit_gate_h_V_init is set to zeros before
# concatenating with mem_logit_y_emb. The main encoder_layers output is
# unchanged.
# ============================================================

membrane_inject:
  mem_net_add:
    enabled: false

  mem_net_concat:
    enabled: false

  adaln:
    enabled: false

  cross_attn:
    enabled: false

cfg:
  enabled: false

mem_logit_modulation: false
mem_logit_gate_modulation: true
mem_logit_gate_zero_encoder: true

freeze:
  - features
  - W_e
  - W_s
  - encoder_layers
  - decoder_layers
  - W_out
  - sc_decoder
  - aux_scEnc
  - activate_W_sc_node
  - activate_W_sc_edge
  - activate_W_sc_merge_edge
  - h_V_segment
  - prot_encoder_pifold
  - W_esm_LN
  - W_esm_act
  - W_c
  - unimol_repr_activate
  - lig_plip_itype_embedding
  - lig_encoder
  - mem_net

aa_loss_weights:
  W: 2.0
  Y: 1.5
