# ============================================================
# Gate-only membrane fine-tuning.
# mem_logit_normal_encoder_zero_region_embedding=true means:
#   in NormalEncoder.forward(...), region_embedding(region_ids) is replaced by zeros.
#   z-offset RBF and theta encoding stay unchanged.
# Gate uses mem_logit_gate_encoder_layers output.
# mem_logit_gate_encoder_layers is copied from encoder_layers at init/load time.
# Original encoder_layers stays frozen; mem_logit_gate_encoder_layers is trainable.
# Membrane condition uses unified y_emb:
#   z-offset RBF(20) -> 32,
#   CA-to-virtual-CB theta [sin, cos] -> 32,
#   region embedding -> 64,
#   concat -> 128.
# Trainable modules:
#   mem_logit_gate_encoder_layers
#   mem_logit_normal_encoder
#   mem_logit_gate
#   mem_logit_distribution_projection
# ============================================================

membrane_inject:
  mem_net_add:
    enabled: false

  mem_net_concat:
    enabled: false

  adaln:
    enabled: false

  cross_attn:
    enabled: false

cfg:
  enabled: false

mem_logit_modulation: false
mem_logit_gate_modulation: true
mem_logit_normal_encoder_zero_region_embedding: true

freeze:
  - features
  - W_e
  - W_s
  - encoder_layers
  - decoder_layers
  - W_out
  - sc_decoder
  - aux_scEnc
  - activate_W_sc_node
  - activate_W_sc_edge
  - activate_W_sc_merge_edge
  - h_V_segment
  - prot_encoder_pifold
  - W_esm_LN
  - W_esm_act
  - W_c
  - unimol_repr_activate
  - lig_plip_itype_embedding
  - lig_encoder
  - mem_net

aa_loss_weights:
  W: 2.0
  Y: 1.5
